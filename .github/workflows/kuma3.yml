# kuma3: builds the kuma3 Anki APK from the three kuma3-anki repositories and publishes it.
#
# - a push to rwkv (or "Run workflow"): the rolling pre-release "kuma3-dev", always the newest build
# - a tag v<n>: release <n>, with the notes in kuma3/release-notes/kuma3-<n>.md (v tags, because
#   GitHub's release list sorts kuma3-9 above kuma3-10; v9, v10 sort as numbers)
# - every hour: a new kuma3-dev when kuma3-anki-backend (and so the core) changed since the last one
#
# kuma3-anki-arm64.apk: the kuma3 Anki app (release build, io.github.pedrubik2000.kuma3), signed
# with the release key (secrets KUMA3_KEYSTORE_BASE64, KUMA3_KEYSTORE_PASSWORD). The older debug app
# (com.ichi2.anki.debug) is no longer published since 2026-10-09: it was debuggable.
#
# Two jobs, so the code that builds (crate build scripts, Gradle plugins, actions) never holds a token
# that can write: "build" has a read-only token and uploads the APKs and the notes; "publish" runs no
# third-party code and only creates the release. Actions are pinned to commits (tags can move).
name: kuma3 build

on:
  push:
    branches: [rwkv]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: kuma3-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: github.repository == 'Pedrubik2000/kuma3-anki-app'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      skip: ${{ steps.new.outputs.skip }}
      app_sha: ${{ steps.new.outputs.app_sha }}
    env:
      ANDROID_ARCH: arm64
      SKIP_ROBOLECTRIC: '1'
      NDK_VERSION: 29.0.14206865
    steps:
      - name: App source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: Anki-Android
          persist-credentials: false

      - name: Backend and core source (rwkv)
        run: |
          git clone -q --depth 1 -b rwkv https://github.com/Pedrubik2000/kuma3-anki-backend.git Anki-Android-Backend
          git -C Anki-Android-Backend submodule update -q --init --depth 1 anki
          git -C Anki-Android-Backend/anki submodule update -q --init --depth 1 ftl/core-repo ftl/qt-repo
          echo "APP_SHA=$(git -C Anki-Android rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BACKEND_SHA=$(git -C Anki-Android-Backend rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CORE_SHA=$(git -C Anki-Android-Backend/anki rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Anything new? (hourly runs)
        id: new
        env:
          GH_TOKEN: ${{ github.token }} # read-only here
        run: |
          skip=0
          if [ "${{ github.event_name }}" = schedule ]; then
            body=$(gh release view kuma3-dev --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
            if grep -q "$APP_SHA" <<< "$body" && grep -q "$BACKEND_SHA" <<< "$body"; then skip=1; fi
          fi
          echo "SKIP=$skip" >> "$GITHUB_ENV"
          printf 'skip=%s\napp_sha=%s\n' "$skip" "$APP_SHA" >> "$GITHUB_OUTPUT"
          echo "app $APP_SHA, backend $BACKEND_SHA, core $CORE_SHA; skip=$skip"

      - name: Java 21
        if: env.SKIP != '1'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      # restored here, saved right after the backend build (below), so a later failure keeps it
      - name: Rust cache
        id: rust-cache
        if: env.SKIP != '1'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # the installed tools with cargo's list of them (the backend build checks that list)
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            Anki-Android-Backend/target
            Anki-Android-Backend/anki/out
          key: kuma3-rust2-${{ hashFiles('Anki-Android-Backend/Cargo.lock', 'Anki-Android-Backend/anki/Cargo.lock') }}-${{ env.CORE_SHA }}
          restore-keys: |
            kuma3-rust2-${{ hashFiles('Anki-Android-Backend/Cargo.lock', 'Anki-Android-Backend/anki/Cargo.lock') }}-
            kuma3-rust2-

      - name: Rust 1.97.1, cargo-ndk, n2
        if: env.SKIP != '1'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target aarch64-linux-android
          rustup default 1.97.1
          # with the Rust cache, both are there already
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk@4.1.2
          command -v n2 >/dev/null || cargo install --git https://github.com/evmar/n2.git --rev 53ec691df749277104d1d4201a344fe4243d6d0a

      - name: Android SDK packages and NDK
        if: env.SKIP != '1'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\nlocal_backend=true\n' "$ANDROID_HOME" > Anki-Android/local.properties

      - name: Gradle cache
        if: env.SKIP != '1'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Backend (Rust and web pages)
        if: env.SKIP != '1'
        working-directory: Anki-Android-Backend
        env:
          # keep the runner's paths out of the native library
          ANDROID_RUSTFLAGS: --remap-path-prefix=/home/runner=/build
        # stop its Gradle daemon: left running, it held memory while the app's Gradle (another
        # daemon, other settings) ran R8, and the APK build hung after packaging
        run: |
          RELEASE=1 cargo run -p build_rust
          ./gradlew --stop

      - name: Save the Rust cache
        if: env.SKIP != '1' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            Anki-Android-Backend/target
            Anki-Android-Backend/anki/out
          key: kuma3-rust2-${{ hashFiles('Anki-Android-Backend/Cargo.lock', 'Anki-Android-Backend/anki/Cargo.lock') }}-${{ env.CORE_SHA }}

      - name: Signing key
        if: env.SKIP != '1'
        env:
          KEYSTORE: ${{ secrets.KUMA3_KEYSTORE_BASE64 }}
        run: base64 -d <<< "$KEYSTORE" > "$RUNNER_TEMP/kuma3-release.jks"

      - name: APKs
        if: env.SKIP != '1'
        # Gradle sometimes hangs after packageFullRelease (3 times by 2026-10-08; normally ~11 min
        # in all): stop it after 20 min and build again, the second run only finishes up (~1 min)
        timeout-minutes: 40
        working-directory: Anki-Android
        env:
          KEYSTOREPATH: ${{ runner.temp }}/kuma3-release.jks
          KEYSTOREPWD: ${{ secrets.KUMA3_KEYSTORE_PASSWORD }}
          KEYPWD: ${{ secrets.KUMA3_KEYSTORE_PASSWORD }}
          KEYALIAS: kuma3
        run: |
          tasks=":AnkiDroid:assembleFullRelease -PabiFilter=arm64-v8a"
          timeout 20m ./gradlew $tasks || { echo "::warning::Gradle hung or failed, building again"; ./gradlew --stop; ./gradlew $tasks; }

      - name: Check and name the APK
        if: env.SKIP != '1'
        run: |
          mkdir out
          apk=out/kuma3-anki-arm64.apk
          cp Anki-Android/AnkiDroid/build/outputs/apk/full/release/AnkiDroid-full-arm64-v8a-release.apk $apk
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          # no build machine paths in the library
          paths=$(unzip -p "$apk" lib/arm64-v8a/librsdroid.so | strings -a | grep -c '/home/' || true)
          echo "$apk: $paths home paths"
          [ "$paths" = 0 ] || { echo "::error::$apk contains /home/ paths"; exit 1; }
          # signed with the kuma3 key
          "$signer" verify --print-certs "$apk" | grep -E 'DN|SHA-256'
          "$signer" verify --print-certs "$apk" | grep -q 'fb899450de9dfae6350d5147a07bd67f663a673040eb3aca1301ca4d054a0154'
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kuma3-release.jks"

      - name: Release notes
        if: env.SKIP != '1'
        run: |
          source_lines() {
            echo "**Source** (exact commits):"
            echo "- app: Pedrubik2000/kuma3-anki-app@$APP_SHA"
            echo "- backend: Pedrubik2000/kuma3-anki-backend@$BACKEND_SHA"
            echo "- core: Pedrubik2000/kuma3-anki-core@$CORE_SHA"
            echo
            echo "SHA-256:"
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            notes=Anki-Android/kuma3/release-notes/kuma3-${tag#v}.md
            [ -f "$notes" ] || { echo "::error::missing $notes"; exit 1; }
            { cat "$notes"; echo; cat Anki-Android/kuma3/release-template.md; echo; source_lines; } > notes.md
          else
            {
              echo "Development build: the newest code, for trying things out. It changes with every push."
              echo "For the release, see Latest."
              echo
              source_lines
            } > notes.md
          fi

      - name: Hand the APKs to the publish job
        if: env.SKIP != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            out/
            notes.md
          retention-days: 3

  # the only job that can write: it runs gh and nothing else
  publish:
    needs: build
    if: needs.build.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_SHA: ${{ needs.build.outputs.app_sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release

      - name: Publish
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            gh release create "$tag" out/*.apk out/SHA256SUMS.txt --title "kuma3 Anki ${tag#v}" --notes-file notes.md --latest
          else
            gh release delete kuma3-dev --yes --cleanup-tag 2>/dev/null || true
            gh release create kuma3-dev out/*.apk out/SHA256SUMS.txt --target "$APP_SHA" --prerelease --latest=false \
              --title "kuma3 Anki (development build)" --notes-file notes.md
          fi
