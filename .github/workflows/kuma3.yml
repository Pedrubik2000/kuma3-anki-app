# kuma3: builds the two APKs from the three kuma3-anki repositories and publishes them.
#
# - a push to rwkv (or "Run workflow"): the rolling pre-release "kuma3-dev", always the newest build
# - a tag kuma3-<n>: the release, with the notes in kuma3/release-notes/kuma3-<n>.md
# - every hour: a new kuma3-dev when kuma3-anki-backend (and so the core) changed since the last one
#
# The APKs:
# - kuma3-anki-arm64.apk: the kuma3 Anki app (release build, io.github.pedrubik2000.kuma3), signed
#   with the release key (secrets KUMA3_KEYSTORE_BASE64, KUMA3_KEYSTORE_PASSWORD)
# - kuma3-anki-debug-arm64.apk: the older debug app (com.ichi2.anki.debug), signed with the debug key
#   its users have (secret KUMA3_DEBUG_KEYSTORE_BASE64), so it still updates in place
name: kuma3 build

on:
  push:
    branches: [rwkv]
    tags: ['kuma3-*']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: kuma3-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: github.repository == 'Pedrubik2000/kuma3-anki-app'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID_ARCH: arm64
      SKIP_ROBOLECTRIC: '1'
      NDK_VERSION: 29.0.14206865
    steps:
      - name: App source
        uses: actions/checkout@v5
        with:
          path: Anki-Android

      - name: Backend and core source (rwkv)
        run: |
          git clone -q --depth 1 -b rwkv https://github.com/Pedrubik2000/kuma3-anki-backend.git Anki-Android-Backend
          git -C Anki-Android-Backend submodule update -q --init --depth 1 anki
          git -C Anki-Android-Backend/anki submodule update -q --init --depth 1 ftl/core-repo ftl/qt-repo
          echo "APP_SHA=$(git -C Anki-Android rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BACKEND_SHA=$(git -C Anki-Android-Backend rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CORE_SHA=$(git -C Anki-Android-Backend/anki rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Anything new? (hourly runs)
        run: |
          skip=0
          if [ "${{ github.event_name }}" = schedule ]; then
            body=$(gh release view kuma3-dev --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
            if grep -q "$APP_SHA" <<< "$body" && grep -q "$BACKEND_SHA" <<< "$body"; then skip=1; fi
          fi
          echo "SKIP=$skip" >> "$GITHUB_ENV"
          echo "app $APP_SHA, backend $BACKEND_SHA, core $CORE_SHA; skip=$skip"

      - name: Java 21
        if: env.SKIP != '1'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # restored here, saved right after the backend build (below), so a later failure keeps it
      - name: Rust cache
        id: rust-cache
        if: env.SKIP != '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            Anki-Android-Backend/target
            Anki-Android-Backend/anki/out
          key: kuma3-rust-${{ hashFiles('Anki-Android-Backend/Cargo.lock', 'Anki-Android-Backend/anki/Cargo.lock') }}-${{ env.CORE_SHA }}
          restore-keys: |
            kuma3-rust-${{ hashFiles('Anki-Android-Backend/Cargo.lock', 'Anki-Android-Backend/anki/Cargo.lock') }}-
            kuma3-rust-

      - name: Rust 1.97.1, cargo-ndk, n2
        if: env.SKIP != '1'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target aarch64-linux-android
          rustup default 1.97.1
          # the cached ~/.cargo/bin has them (cargo's install list is not cached: check the programs)
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk@4.1.2
          command -v n2 >/dev/null || cargo install --git https://github.com/evmar/n2.git --rev 53ec691df749277104d1d4201a344fe4243d6d0a

      - name: Android SDK packages and NDK
        if: env.SKIP != '1'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\nlocal_backend=true\n' "$ANDROID_HOME" > Anki-Android/local.properties

      - name: Gradle cache
        if: env.SKIP != '1'
        uses: gradle/actions/setup-gradle@v4

      - name: Backend (Rust and web pages)
        if: env.SKIP != '1'
        working-directory: Anki-Android-Backend
        env:
          # keep the runner's paths out of the native library
          ANDROID_RUSTFLAGS: --remap-path-prefix=/home/runner=/build
        run: RELEASE=1 cargo run -p build_rust

      - name: Save the Rust cache
        if: env.SKIP != '1' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            Anki-Android-Backend/target
            Anki-Android-Backend/anki/out
          key: kuma3-rust-${{ hashFiles('Anki-Android-Backend/Cargo.lock', 'Anki-Android-Backend/anki/Cargo.lock') }}-${{ env.CORE_SHA }}

      - name: Signing keys
        if: env.SKIP != '1'
        env:
          KEYSTORE: ${{ secrets.KUMA3_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE: ${{ secrets.KUMA3_DEBUG_KEYSTORE_BASE64 }}
        run: |
          base64 -d <<< "$KEYSTORE" > "$RUNNER_TEMP/kuma3-release.jks"
          mkdir -p ~/.android
          base64 -d <<< "$DEBUG_KEYSTORE" > ~/.android/debug.keystore

      - name: APKs
        if: env.SKIP != '1'
        working-directory: Anki-Android
        env:
          KEYSTOREPATH: ${{ runner.temp }}/kuma3-release.jks
          KEYSTOREPWD: ${{ secrets.KUMA3_KEYSTORE_PASSWORD }}
          KEYPWD: ${{ secrets.KUMA3_KEYSTORE_PASSWORD }}
          KEYALIAS: kuma3
        run: ./gradlew :AnkiDroid:assembleFullRelease :AnkiDroid:assembleFullDebug -PabiFilter=arm64-v8a

      - name: Check and name the APKs
        if: env.SKIP != '1'
        run: |
          mkdir out
          cp Anki-Android/AnkiDroid/build/outputs/apk/full/release/AnkiDroid-full-arm64-v8a-release.apk out/kuma3-anki-arm64.apk
          cp Anki-Android/AnkiDroid/build/outputs/apk/full/debug/AnkiDroid-full-arm64-v8a-debug.apk out/kuma3-anki-debug-arm64.apk
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          # On the runner Gradle signed the debug app with a debug key of its own: sign it again with
          # the debug key its users have (Android's standard debug key settings)
          "$signer" sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey \
            --key-pass pass:android out/kuma3-anki-debug-arm64.apk
          for apk in out/*.apk; do
            # no build machine paths in the library
            paths=$(unzip -p "$apk" lib/arm64-v8a/librsdroid.so | strings -a | grep -c '/home/' || true)
            echo "$apk: $paths home paths"
            [ "$paths" = 0 ] || { echo "::error::$apk contains /home/ paths"; exit 1; }
            "$signer" verify --print-certs "$apk" | grep -E 'DN|SHA-256'
          done
          # the release app must be signed with the kuma3 key, the debug app with its users' key
          "$signer" verify --print-certs out/kuma3-anki-arm64.apk | grep -q 'fb899450de9dfae6350d5147a07bd67f663a673040eb3aca1301ca4d054a0154'
          "$signer" verify --print-certs out/kuma3-anki-debug-arm64.apk | grep -q '33e879992202debe802aeb31d0f65ea9de3e7568058895c2183738a481e35ed6'
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish
        if: env.SKIP != '1'
        run: |
          source_lines() {
            echo "**Source** (exact commits):"
            echo "- app: Pedrubik2000/kuma3-anki-app@$APP_SHA"
            echo "- backend: Pedrubik2000/kuma3-anki-backend@$BACKEND_SHA"
            echo "- core: Pedrubik2000/kuma3-anki-core@$CORE_SHA"
            echo
            echo "SHA-256:"
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          }
          if [[ "$GITHUB_REF" == refs/tags/kuma3-* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            notes=Anki-Android/kuma3/release-notes/$tag.md
            [ -f "$notes" ] || { echo "::error::missing $notes"; exit 1; }
            { cat "$notes"; echo; cat Anki-Android/kuma3/release-template.md; echo; source_lines; } > notes.md
            gh release create "$tag" out/*.apk out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --title "kuma3 Anki ${tag#kuma3-}" --notes-file notes.md --latest
          else
            {
              echo "Development build: the newest code, for trying things out. It changes with every push."
              echo "For the release, see Latest."
              echo
              source_lines
            } > notes.md
            gh release delete kuma3-dev --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            gh release create kuma3-dev out/*.apk out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --target "$APP_SHA" --prerelease --latest=false \
              --title "kuma3 Anki (development build)" --notes-file notes.md
          fi
